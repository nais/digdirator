---
apiVersion: nais.io/v1
kind: IDPortenClient
metadata:
  name: my-app
  namespace: myteam
spec:
  clientURI: "https://min-app.nav.no"
  redirectURIs:
    - https://min-app.nav.no/oauth2/callback
  secretName: idporten-secret
  frontchannelLogoutURI: "https://min-app.nav.no/oauth2/logout"
  backchannelLogoutURI: "https://min-app.nav.no/oauth2/logout/backchannel"
  postLogoutRedirectURIs:
    - "https://nav.no"
  accessTokenLifetime: 3600
  refreshTokenLifetime: 7200
  sessionLifetime: 28800
  ssoDisabled: false
